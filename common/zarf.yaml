kind: ZarfPackageConfig
metadata:
  name: uds-postgres-operator-common
  description: "UDS Postgres Operator Common"
  url: https://github.com/zalando/postgres-operator

components:
  - name: postgres-operator
    required: true
    charts:
      - name: uds-postgres-config
        namespace: postgres-operator
        version: 0.1.0
        localPath: ../chart
        values:
          - sourcePath: .uds-postgres-config
            targetPath: .
            excludePaths:
              - .uds-postgres-config.job.image
              - .uds-postgres-config.metrics.image
      - name: postgres-operator
        version: 2.0.2
        namespace: postgres-operator
        url: https://opensource.zalando.com/postgres-operator/charts/postgres-operator
        valuesFiles:
          - ../values/values.yaml
        values:
          - sourcePath: .postgres-operator
            targetPath: .
            excludePaths:
              - .postgres-operator.image
              - .postgres-operator.imagePullSecrets
              - .postgres-operator.configGeneral.docker_image
              - .postgres-operator.configGeneral.enable_crd_registration
              - .postgres-operator.configLogicalBackup.logical_backup_docker_image
              - .postgres-operator.configConnectionPooler.connection_pooler_image
              - .postgres-operator.securityContext
    actions:
      onDeploy:
        before:
          # this shims postgres operator versions v0.11.1-uds.1 and below to the new config chart namespace layout
          - cmd: |
              if ./zarf tools kubectl get namespace postgres 2>/dev/null; then
                ./zarf tools kubectl annotate --overwrite postgresql -n postgres pg-cluster meta.helm.sh/release-namespace=postgres-operator || true
                ./zarf tools kubectl annotate --overwrite service -n postgres pg-cluster-headless meta.helm.sh/release-namespace=postgres-operator || true
                ./zarf tools kubectl annotate --overwrite package -n postgres postgres meta.helm.sh/release-namespace=postgres-operator || true
              fi
          # Upstream v2.0.2 hard-codes Recreate in the Deployment strategy (https://github.com/zalando/postgres-operator/pull/3164/files).
          # v1 Deployments retain rollingUpdate, which Zarf's SSA upgrade can submit with Recreate and Kubernetes rejects.
          # Remove this shim when upgrades from v1.x packages are no longer supported.
          - cmd: |
              if ./zarf tools kubectl get deployment postgres-operator -n postgres-operator >/dev/null 2>&1; then
                ./zarf tools kubectl patch deployment postgres-operator -n postgres-operator --type=json --patch='[{"op":"replace","path":"/spec/strategy","value":{"type":"Recreate"}}]'
              fi
        after:
          - description: Validate Postgres Operator Package
            maxTotalSeconds: 300
            wait:
              cluster:
                kind: packages.uds.dev
                name: postgres-operator
                namespace: postgres-operator
                condition: "'{.status.phase}'=Ready"
          - description: Validate Postgres Package
            maxTotalSeconds: 300
            cmd: |
              if ./zarf tools kubectl get namespace postgres 2>/dev/null; then
                if ./zarf tools kubectl get packages.uds.dev postgres -n postgres; then
                  ./zarf tools wait-for packages.uds.dev postgres -n postgres '{.status.phase}'=Ready
                fi
              fi
          - description: Postgres Operator to be Healthy
            maxTotalSeconds: 90
            wait:
              cluster:
                kind: pod
                name: app.kubernetes.io/name=postgres-operator
                namespace: postgres-operator
                condition: Ready
          - description: Wait for Postgres cluster to be Running if postgresql.enabled is true
            maxTotalSeconds: 300
            cmd: |
              if ./zarf tools kubectl get namespace postgres 2>/dev/null; then
                if ./zarf tools kubectl get postgresql pg-cluster -n postgres; then
                  ./zarf tools wait-for postgresql pg-cluster -n postgres '{.status.PostgresClusterStatus}'=Running
                fi
              fi
