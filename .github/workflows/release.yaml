name: Release

on:
  push:
    branches:
      - main

# Permissions for the GITHUB_TOKEN used by the workflow.
permissions:
  contents: read # Allows reading the content of the repository.
  packages: read # Allows reading the content of the repository's packages.
  id-token: write

jobs:
  publish:
    runs-on: ${{ matrix.architecture == 'arm64' && 'appstore-4-core-arm64' || 'appstore-4-core-amd64' }}
    timeout-minutes: 40
    permissions:
      contents: write # Allows reading the content of the repository.
      packages: write # Allows reading the content of the repository's packages.
      id-token: write
    strategy:
      matrix:
        flavor: [upstream, registry1, unicorn]
        architecture: [amd64, arm64]
        exclude:
          - flavor: registry1
            architecture: arm64
    steps:
      - name: Build, test, sign, and publish
        uses: defenseunicorns/uds-common/.github/actions/publish@807de6f4efca9f51ee5e8d3e466d5f089c9eaab8 # v1.34.1
        with:
          flavor: ${{ matrix.flavor }}
          options: --set BASE_REPO="ghcr.io/uds-packages"
          registry1-username: ${{ secrets.IRON_BANK_ROBOT_USERNAME }}
          registry1-password: ${{ secrets.IRON_BANK_ROBOT_PASSWORD }}
          rapidfort-username: ${{ secrets.RAPIDFORT_USERNAME }}
          rapidfort-password: ${{ secrets.RAPIDFORT_PASSWORD }}
          chainguard-identity: ${{ secrets.CHAINGUARD_IDENTITY }}
