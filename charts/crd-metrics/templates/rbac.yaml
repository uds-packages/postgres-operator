apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-crd-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgres-crd-metrics.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: postgres-crd-metrics
  labels:
    {{- include "postgres-crd-metrics.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["list", "watch"]
  - apiGroups: ["acid.zalan.do"]
    resources: ["postgresqls"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: postgres-crd-metrics
  labels:
    {{- include "postgres-crd-metrics.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: postgres-crd-metrics
subjects:
  - kind: ServiceAccount
    name: postgres-crd-metrics
    namespace: {{ .Release.Namespace }}
