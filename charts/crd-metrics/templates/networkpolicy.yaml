apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "postgres-crd-metrics.fullname" . }}-allow-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgres-crd-metrics.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "postgres-crd-metrics.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "monitoring"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 8080
          protocol: TCP
        - port: 15008
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "postgres-crd-metrics.fullname" . }}-allow-healthprobes
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgres-crd-metrics.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
     {{- include "postgres-crd-metrics.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    # Kubelet liveness/readiness probes, source-rewritten by ztunnel in ambient mode.
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "postgres-crd-metrics.fullname" . }}-egress-dns
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgres-crd-metrics.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "postgres-crd-metrics.selectorLabels" . | nindent 6 }}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
