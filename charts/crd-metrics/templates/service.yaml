apiVersion: v1
kind: Service
metadata:
  name: postgres-crd-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgres-crd-metrics.selectorLabels" . | nindent 4 }}
spec:
  selector:
    {{- include "postgres-crd-metrics.selectorLabels" . | nindent 4 }}
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
  