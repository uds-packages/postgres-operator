# Dedicated kube-state-metrics instance running in custom-resource-state-only mode,
# emitting metrics derived from the postgresql.acid.zalan.do CR so that
# postgres_exporter metrics can be joined against CR spec/status dimensions.
image: null
replicas: 1
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi
# Namespaces to watch. Empty list = all namespaces (requires cluster-scoped RBAC).
namespaces: []

kubeApiCIDR: null

# create a custom PodMonitor for the postgres exporter, specifically to include postgresql CRD labels (cluster_name, team_id, spilo_role)
# NOTE: enabling this will disable the PodMonitor created by the UDS Package CR (as relabelings are required and not supported by the uds-operator)
podMonitor:
  enabled: false
  additionalLabels: []
  additionalAnnotations: []
  relabelings: []
    # - action: replace
    #   sourceLabels: [__meta_kubernetes_pod_label_cluster_name]
    #   targetLabel: cluster_name
    # - action: replace
    #   sourceLabels: [__meta_kubernetes_pod_label_spilo_role]
    #   targetLabel: spilo_role
    # - action: replace
    #   sourceLabels: [__meta_kubernetes_pod_label_team]
    #   targetLabel: team