{{- if .Values.customPodMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgres-exporter-pod-monitor
  {{- if .Values.customPodMonitor.additionalLabels }}
  labels:
    {{- toYaml .Values.customPodMonitor.additionalLabels | nindent 4 }}
  {{- end }}
  {{- if .Values.customPodMonitor.additionalAnnotations }}
  annotations:
    {{- toYaml .Values.customPodMonitor.additionalAnnotations | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      application: spilo
  podMetricsEndpoints:
    - port: exporter
      path: /metrics
      podTargetLabels:
        - cluster_name
        - spilo_role
        - team
      # relabelings: []
      {{- if .Values.customPodMonitor.relabelings }}
      relabelings:
        {{- toYaml .Values.customPodMonitor.relabelings | nindent 8 }}
      {{- end }}
{{- end -}}
