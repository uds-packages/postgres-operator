ambient: true

postgresql:
  enabled: false
  parameters: []
  ingress: []
  resources:
    limits:
      cpu: 500m
      memory: 500Mi
    requests:
      cpu: 100m
      memory: 100Mi
  additionalVolumes: []
  env: []

# Example values for postgresql
#
# postgresql:
#   enabled: true
#   teamId: "uds"
#   volume:
#     size: "1Gi"
#   numberOfInstances: 2
#   users:
#     mynamespace.myuser: []  # database owner
#     # yournamespace.youruser: []  # database owner
#   databases:
#     mydb: mynamespace.myuser
#     yourdb: yournamespace.youruser
#   extensions:
#     mydb: ["postgis","hstore"] # database extensions
#   version: "14"
#   ingress:
#     - remoteGenerated: Anywhere
# or
#   ingress:
#     - remoteNamespace: tempo
#       remoteSelector:
#         app.kubernetes.io/name: tempo

job:
  # Job image to use for running extension loading jobs (e.g. ghcr.io/zalando/spilo-17:4.0-p2 - needs the psql client)
  image: ""

additionalNetworkAllow: []
  # - direction: Egress
  #   selector:
  #     app.kubernetes.io/name: postgres-operator
  #   remoteNamespace: acid
  #   remoteSelector:
  #     cluster-name: pg-cluster
  #   description: "Egress to a non-default pg cluster"

# create a custom PodMonitor for the postgres exporter, specifically to include postgresql CRD labels (cluster_name, team_id, spilo_role)
# NOTE: enabling this will disable the PodMonitor created by the UDS Package CR (as relabelings are required and not supported by the uds-operator)
customPodMonitor:
  enabled: false
  additionalLabels: []
  additionalAnnotations: []
  relabelings: []
    # - action: replace
    #   sourceLabels: [__meta_kubernetes_pod_label_cluster_name]
    #   targetLabel: cluster_name
    # - action: replace
    #   sourceLabels: [__meta_kubernetes_pod_label_spilo_role]
    #   targetLabel: spilo_role
    # - action: replace
    #   sourceLabels: [__meta_kubernetes_pod_label_team]
    #   targetLabel: team
